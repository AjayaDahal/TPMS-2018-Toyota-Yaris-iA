; TPMS panel bring-up + 315 MHz receiver test (ESP32 DOIT DevKit V1)
;   build + flash:  pio run -t upload        serial monitor:  pio device monitor
[env:esp32doit-devkit-v1]
platform = espressif32@6.13.0      ; Arduino-ESP32 2.0.x
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.36.18
build_flags = -Wall

; Bare ESP32 + E07-M1101D breadboard test (no OLED, encoder, LEDs, or buzzer)
[env:bench-cc1101]
extends = env:esp32doit-devkit-v1
build_flags = -Wall -DTPMS_BENCH_BARE
